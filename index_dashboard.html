<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171614">
<title>MY MONEY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee9df;color:#24211d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-size:18px;letter-spacing:3px;font-weight:700}
.month{font-size:13px;color:#766f64}
.card{background:#191816;color:#f6f0e5;border-radius:24px;padding:25px 22px;box-shadow:0 12px 30px #00000018}
.label{font-size:12px;color:#aaa297;letter-spacing:1px}
.balance{font-size:38px;font-weight:700;margin:6px 0 20px;letter-spacing:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#292723;border-radius:15px;padding:13px}
.stat small{color:#aaa297;font-size:11px}.stat b{display:block;margin-top:4px;font-size:17px}
.in{color:#d8c9a7}.out{color:#f0ded2}
.add{width:100%;border:0;border-radius:18px;background:#c8b38d;color:#191816;font-size:17px;font-weight:700;padding:17px;margin:18px 0;box-shadow:0 8px 18px #00000015}
.section-title{font-weight:700;font-size:16px;margin:10px 2px}
.empty{text-align:center;color:#8d867c;padding:32px 10px}
.item{display:flex;justify-content:space-between;align-items:center;background:#f8f4ec;border-radius:17px;padding:14px 15px;margin:9px 0}
.left{display:flex;gap:12px;align-items:center}
.dot{width:38px;height:38px;border-radius:12px;background:#e4dccd;display:grid;place-items:center}
.name{font-weight:600}.date{font-size:11px;color:#938c82;margin-top:3px}
.amount{font-weight:700}.income{color:#7d8b6d}.expense{color:#9b6658}
.del{border:0;background:none;color:#aaa;font-size:18px;margin-left:8px}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end}
.sheet{background:#f8f4ec;width:100%;max-width:520px;margin:auto;border-radius:28px 28px 0 0;padding:22px 18px 30px}
.sheet h2{margin:0 0 18px}
.row{display:flex;gap:10px;margin-bottom:12px}
input{width:100%;border:1px solid #d8d0c2;border-radius:14px;padding:15px;font-size:16px;background:#fffdf8;outline:none}
.type{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.type button{padding:14px;border:1px solid #d8d0c2;border-radius:14px;background:#fffdf8;font-size:15px}
.type .selected{background:#191816;color:#fff}
.actions{display:flex;gap:10px}.cancel,.save{flex:1;padding:15px;border-radius:15px;font-size:16px;font-weight:700}
.cancel{border:1px solid #d2c9ba;background:transparent}.save{border:0;background:#191816;color:#fff}


.dashboard{background:#f8f4ec;border-radius:22px;padding:19px 17px;margin:4px 0 18px;border:1px solid #e1d8ca}
.dash-head{display:flex;justify-content:space-between;align-items:center}
.dash-label{font-size:10px;letter-spacing:1.6px;color:#918a80}
.dash-title{font-weight:700;margin-top:3px}
.saving-pill{font-size:11px;background:#e5dece;border-radius:999px;padding:8px 10px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.dash-grid>div{background:#eee8dc;border-radius:14px;padding:12px}
.dash-grid span{display:block;font-size:10px;color:#8a8379}
.dash-grid b{display:block;font-size:16px;margin-top:4px}
.chart-title{font-size:12px;font-weight:700;margin:18px 0 8px}
.bars{height:105px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.bar-day{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar-stack{width:100%;height:78px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.bar{width:10px;border-radius:5px 5px 2px 2px;min-height:2px}
.bar.inbar{background:#a7b18f}.bar.outbar{background:#9b7769}
.bar-day small{font-size:9px;color:#999087;margin-top:5px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">MY MONEY</div><div class="month" id="month"></div></header>

<div class="card">
  <div class="label">BALANCE</div>
  <div class="balance" id="balance">NT$ 0</div>
  <div class="stats">
    <div class="stat"><small>รายรับเดือนนี้</small><b class="in" id="income">+ NT$ 0</b></div>
    <div class="stat"><small>รายจ่ายเดือนนี้</small><b class="out" id="expense">− NT$ 0</b></div>
  </div>
</div>

<button class="add" onclick="openSheet()">＋ เพิ่มรายการ</button>
<div class="dashboard">
  <div class="dash-head">
    <div>
      <div class="dash-label">MONTHLY SUMMARY</div>
      <div class="dash-title" id="dashMonth">เดือนนี้</div>
    </div>
    <div class="saving-pill" id="savingRate">ออม 0%</div>
  </div>
  <div class="dash-grid">
    <div><span>เงินเหลือสุทธิ</span><b id="netMonth">NT$ 0</b></div>
    <div><span>เทียบเดือนก่อน</span><b id="compareMonth">—</b></div>
  </div>
  <div class="chart-title">การใช้เงิน 7 วันล่าสุด</div>
  <div class="bars" id="bars"></div>
</div>

<div class="section-title">รายการล่าสุด</div>
<div id="list"></div>
</div>

<div class="overlay" id="overlay">
<div class="sheet">
<h2>เพิ่มรายการ</h2>
<div class="row"><input id="name" placeholder="เช่น ข้าว / เงินเดือน"><input id="amount" type="number" inputmode="decimal" placeholder="จำนวน"></div>
<div class="type"><button id="expenseBtn" class="selected" onclick="setType('expense')">− รายจ่าย</button><button id="incomeBtn" onclick="setType('income')">＋ รายรับ</button></div>
<div class="actions"><button class="cancel" onclick="closeSheet()">ยกเลิก</button><button class="save" onclick="saveItem()">บันทึก</button></div>
</div>
</div>

<script>
let items=JSON.parse(localStorage.getItem('myMoneyItems')||'[]');
let type='expense';
const money=n=>'NT$ '+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
function setType(t){type=t;document.getElementById('expenseBtn').classList.toggle('selected',t==='expense');document.getElementById('incomeBtn').classList.toggle('selected',t==='income')}
function openSheet(){document.getElementById('overlay').style.display='flex';setTimeout(()=>document.getElementById('name').focus(),100)}
function closeSheet(){document.getElementById('overlay').style.display='none';document.getElementById('name').value='';document.getElementById('amount').value='';setType('expense')}
function saveItem(){
 const name=document.getElementById('name').value.trim(), amount=Number(document.getElementById('amount').value);
 if(!name||!amount||amount<0){alert('กรุณาใส่รายการและจำนวนเงิน');return}
 items.unshift({id:Date.now(),name,amount,type,date:new Date().toISOString()});
 localStorage.setItem('myMoneyItems',JSON.stringify(items));closeSheet();render();
}
function removeItem(id){if(confirm('ลบรายการนี้ใช่ไหม?')){items=items.filter(x=>x.id!==id);localStorage.setItem('myMoneyItems',JSON.stringify(items));render()}}
function render(){
 const now=new Date(), y=now.getFullYear(), m=now.getMonth();
 const monthItems=items.filter(x=>{const d=new Date(x.date);return d.getFullYear()===y&&d.getMonth()===m});
 const inc=monthItems.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0);
 const exp=monthItems.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 const net=inc-exp;
 document.getElementById('income').textContent='+ '+money(inc);
 document.getElementById('expense').textContent='− '+money(exp);
 document.getElementById('balance').textContent=money(
   items.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0) -
   items.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)
 );
 document.getElementById('month').textContent=now.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
 document.getElementById('dashMonth').textContent=now.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
 const rate=inc>0?Math.max(0,Math.round(net/inc*100)):0;
 document.getElementById('savingRate').textContent='ออม '+rate+'%';
 document.getElementById('netMonth').textContent=money(net);

 const prev=new Date(y,m-1,1), py=prev.getFullYear(), pm=prev.getMonth();
 const prevExp=items.filter(x=>{const d=new Date(x.date);return x.type==='expense'&&d.getFullYear()===py&&d.getMonth()===pm}).reduce((a,x)=>a+x.amount,0);
 const compare=document.getElementById('compareMonth');
 if(prevExp===0) compare.textContent='—';
 else {
   const diff=exp-prevExp, pct=Math.round(Math.abs(diff)/prevExp*100);
   compare.textContent=(diff<=0?'↓ ใช้น้อยลง ':'↑ ใช้เพิ่มขึ้น ')+pct+'%';
 }

 const bars=document.getElementById('bars');
 let max=1;
 const days=[];
 for(let i=6;i>=0;i--){
   const d=new Date(y,m,now.getDate()-i); days.push(d);
   const vals=monthItems.filter(x=>{const q=new Date(x.date);return q.toDateString()===d.toDateString()});
   const ei=vals.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0);
   const eo=vals.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
   max=Math.max(max,ei,eo);
 }
 bars.innerHTML=days.map(d=>{
   const vals=monthItems.filter(x=>{const q=new Date(x.date);return q.toDateString()===d.toDateString()});
   const ei=vals.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0);
   const eo=vals.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
   return `<div class="bar-day"><div class="bar-stack"><div class="bar inbar" style="height:${Math.max(2,ei/max*72)}px"></div><div class="bar outbar" style="height:${Math.max(2,eo/max*72)}px"></div></div><small>${d.getDate()}</small></div>`;
 }).join('');

 const list=document.getElementById('list');
 if(!items.length){list.innerHTML='<div class="empty">ยังไม่มีรายการ<br>กด “＋ เพิ่มรายการ” เพื่อเริ่มต้น</div>';return}
 list.innerHTML=items.slice(0,30).map(x=>{
   const d=new Date(x.date).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
   return `<div class="item"><div class="left"><div class="dot">${x.type==='income'?'＋':'−'}</div><div><div class="name">${escapeHtml(x.name)}</div><div class="date">${d}</div></div></div><div><span class="amount ${x.type}">${x.type==='income'?'+':'−'} ${money(x.amount)}</span><button class="del" onclick="removeItem(${x.id})">×</button></div></div>`
 }).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
render();
</script>
</body>
</html>
